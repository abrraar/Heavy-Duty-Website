<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy Duty | Shared Content</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0D0D0D;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 400px;
            padding: 40px 24px;
        }

        .logo-main {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #FFFFFF;
            margin-bottom: 32px;
        }

        .icon {
            width: 72px;
            height: 72px;
            background-color: #8B1A2F1A;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            border: 1px solid #8B1A2F33;
        }

        .icon svg {
            width: 32px;
            height: 32px;
            fill: #8B1A2F;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            font-weight: 800;
        }

        p {
            color: #CCCCCC;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 48px;
            font-weight: 300;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            font-weight: 800;
            text-decoration: none;
            margin-bottom: 16px;
            transition: all 0.2s;
            box-sizing: border-box;
            letter-spacing: 1px;
            font-size: 14px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: #8B1A2F;
            color: #FFFFFF;
            box-shadow: 0 8px 24px rgba(139, 26, 47, 0.2);
        }

        .footer {
            margin-top: 60px;
            font-size: 11px;
            color: #444444;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-main">HEAVY DUTY</div>

        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M19 13H5v-2h14v2zM12 5L5 12l7 7 1.41-1.41L8.83 13H19v-2H8.83l4.58-4.59L12 5z"/>
            </svg>
        </div>

        <h1>SHARED TEMPLATE</h1>
        <p>A training protocol or nutritional template has been shared with you. To view and save this content, open it in the Heavy Duty app.</p>

        <a href="javascript:void(0)" onclick="openApp()" class="btn btn-primary">OPEN IN APP</a>

        <div class="footer">
            HEAVYDUTYAPP.ORG
        </div>
    </div>

    <script>
        function openApp() {
            // Re-trigger the deep link
            window.location.href = window.location.href;
        }
    </script>
</body>
</html>
