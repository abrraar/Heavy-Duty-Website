<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Heavy Duty</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">HEAVY DUTY</a>
        <div class="nav-links">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <header class="page-header">
        <h1 class="section-title">CONTACT <span>US</span></h1>
    </header>

    <main class="page-content">
        <form action="https://formspree.io/md.alabrar.mjd@gmail.com" method="POST" class="contact-form">
            <div class="form-group">
                <label for="email">YOUR EMAIL ADDRESS</label>
                <input type="email" name="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="message">YOUR MESSAGE</label>
                <textarea name="message" id="message" required placeholder="How can we help you reach maximum adaptation?"></textarea>
            </div>
            <button type="submit" class="btn btn-submit">SEND MESSAGE</button>
        </form>

        <p style="margin-top: 40px; color: #666666; font-size: 14px; text-align: center;">We aim to respond to all inquiries within 48 hours.</p>
    </main>

    <footer>
        <div class="nav-logo">HEAVY DUTY</div>
        <p style="color: #444444; margin-top: 10px; text-align: center;">&copy; 2026 HEAVYDUTYAPP.ORG</p>
        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
        </div>
    </footer>
</body>
</html>
