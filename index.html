<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy Duty | High Intensity Training</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0D0D0D;
            color: #FFFFFF;
            font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
            font-weight: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 450px;
            padding: 40px 24px;
        }

        .logo-container {
            margin-bottom: 48px;
        }

        .logo-main {
            font-size: 48px;
            letter-spacing: 6px;
            color: #FFFFFF;
            margin: 0;
            line-height: 1;
        }

        .logo-sub {
            font-size: 14px;
            letter-spacing: 3px;
            color: #8B1A2F;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: 32px;
            margin-bottom: 24px;
            letter-spacing: 1px;
            color: #FFFFFF;
        }

        .hero-desc {
            color: #CCCCCC;
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 48px;
            letter-spacing: 0.5px;
        }

        .badge-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 60px;
        }

        .coming-soon {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 4px;
            background-color: #1A1A1A;
            border: 1px solid #333333;
            color: #8B1A2F;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .footer {
            position: absolute;
            bottom: 40px;
            font-size: 12px;
            color: #444444;
            letter-spacing: 2px;
        }

        @media (max-height: 600px) {
            .footer { position: static; margin-top: 20px; }
            body { height: auto; padding: 40px 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <h1 class="logo-main">HEAVY DUTY</h1>
            <div class="logo-sub">High Intensity Training</div>
        </div>

        <h2 class="hero-title">BEYOND FAILURE</h2>
        <p class="hero-desc">THE DEFINITIVE TRACKING SYSTEM FOR MENTZER-INSPIRED HIGH INTENSITY TRAINING. LOG YOUR SESSIONS, TRACK PROGRESSION, AND MASTER YOUR RECOVERY.</p>

        <div class="badge-container">
            <div class="coming-soon">App Store • Coming Soon</div>
        </div>

        <div class="footer">
            &copy; 2026 HEAVYDUTYAPP.ORG
        </div>
    </div>
</body>
</html>
